[project]
name = "prism-umm"
version = "0.1.0"
description = "Prism: teachability-guided cross-modal self-improvement for unified multimodal models (model-agnostic)."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "accelerate==1.10.1",
    "decord==0.6.0",
    "deepspeed==0.14.4",
    "einops==0.8.2",
    "huggingface-hub>=0.34",
    "numpy==1.26.0",
    "opencv-python>=4.7",
    "peft==0.19.1",
    "pillow==12.0.0",
    "pyarrow>=11",
    "pyyaml>=6",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "transformers==4.57.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.ruff]
line-length = 120
target-version = "py310"
